<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postlar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #050505 100%);
            color: #ffffff;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #d4af37 0%, #fff8dc 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .post-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                        0 0 15px rgba(212, 175, 55, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.7),
                        0 0 25px rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.4);
        }

        h2 {
            font-size: 1.5rem;
            color: #d4af37;
            margin-bottom: 12px;
        }

        p {
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        h6 {
            font-size: 0.85rem;
            color: #888888;
            font-weight: 400;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Postlar</h1>

        {% for post in posts %}
            <div class="post-card">
                <h2>{{ post.title }}</h2>
                <p>{{ post.about }}</p>
                <h6>{{ post.created_at }}</h6>
            </div>
        {% endfor %}
    </div>

</body>
</html>
